server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) SPA fallback:
    # any path that isn't a real file falls back to index.html
    # so refreshing /login, /farmer/dashboard, etc. works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
